name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: j178/prek-action@v3.0.1

  pr-title:
    name: pr-title
    # Squash merges make the PR title the commit semantic-release sees on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    name: build-test (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: toolbox:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
      - name: Smoke test every binary
        run: docker run --rm --platform "${{ matrix.platform }}" -v "$PWD/tests:/tests:ro" toolbox:ci /tests/smoke.sh
      - name: Scan image for CRITICAL vulnerabilities
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: toolbox:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
